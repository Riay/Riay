<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Capnet Agenda: agenda y operación del equipo integrada a Slack, Zoom, Redmine y correo. 19 mil líneas de Python, 42 modelos, 341 pruebas, API REST v1.">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#161B21"/></pattern>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
      .chip{fill:#11151A;stroke:#2A313A}
      .ct{font-size:13px;fill:#C9D1D9}
      .n{font-size:40px;font-weight:700;fill:#F0F3F6}
      .l{font-size:11px;fill:#8B949E;letter-spacing:1.5px}
      .in{opacity:0;animation:in .7s ease-out forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      .pulse{animation:p 1.6s ease-in-out infinite}
      @keyframes p{50%{opacity:.25}}
    </style>
  </defs>
  <rect width="1200" height="440" rx="14" fill="#0B0D10"/>
  <rect width="1200" height="440" rx="14" fill="url(#g)" opacity=".7"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="14" fill="none" stroke="#21262D"/>

  <!-- Encabezado -->
  <g class="in d1">
    <circle class="pulse" cx="62" cy="58" r="5" fill="#FF6B2C"/>
    <text x="78" y="63" class="mono" font-size="13" fill="#FF6B2C" letter-spacing="2">PROYECTO INSIGNIA · EN PRODUCCIÓN</text>
  </g>
  <g class="in d2">
    <text x="56" y="118" class="sans" font-size="46" font-weight="700" fill="#F0F3F6" letter-spacing="-1">Capnet Agenda</text>
    <text x="58" y="152" class="sans" font-size="19" fill="#C9D1D9">Agenda, ausencias y operación del equipo en MX y CO, integrada a Slack.</text>
  </g>

  <!-- Módulos -->
  <g class="in d3 sans">
    <rect class="chip" x="56"  y="180" width="166" height="34" rx="6"/><text class="ct" x="72"  y="202">Sesiones sin empalme</text>
    <rect class="chip" x="232" y="180" width="128" height="34" rx="6"/><text class="ct" x="248" y="202">Series (RRULE)</text>
    <rect class="chip" x="370" y="180" width="170" height="34" rx="6"/><text class="ct" x="386" y="202">Vacaciones LFT / CST</text>
    <rect class="chip" x="550" y="180" width="150" height="34" rx="6"/><text class="ct" x="564" y="202">Flujo de aprobación</text>

    <rect class="chip" x="56"  y="224" width="166" height="34" rx="6"/><text class="ct" x="72"  y="246">Portal de citas público</text>
    <rect class="chip" x="232" y="224" width="186" height="34" rx="6"/><text class="ct" x="248" y="246">Expedientes de personal</text>
    <rect class="chip" x="428" y="224" width="134" height="34" rx="6"/><text class="ct" x="444" y="246">Festivos MX/CO</text>
    <rect class="chip" x="572" y="224" width="128" height="34" rx="6"/><text class="ct" x="588" y="246">Checador</text>

    <rect class="chip" x="56"  y="268" width="252" height="34" rx="6"/><text class="ct" x="72"  y="290">Escalamiento de tickets estancados</text>
    <rect class="chip" x="318" y="268" width="176" height="34" rx="6"/><text class="ct" x="334" y="290">Estado "En sesión" auto</text>
    <rect class="chip" x="504" y="268" width="196" height="34" rx="6"/><text class="ct" x="518" y="290">Zonas horarias por persona</text>
  </g>

  <!-- Métricas -->
  <line x1="740" y1="40" x2="740" y2="320" stroke="#21262D"/>
  <g class="in d4 mono" text-anchor="middle">
    <text class="n sans" x="860" y="122">19k</text><text class="l" x="860" y="146">LÍNEAS DE PYTHON</text>
    <text class="n sans" x="1060" y="122">341</text><text class="l" x="1060" y="146">PRUEBAS AUTOMATIZADAS</text>
    <text class="n sans" x="860" y="248">42</text><text class="l" x="860" y="272">MODELOS DE DATOS</text>
    <text class="n sans" x="1060" y="248">5</text><text class="l" x="1060" y="272">INTEGRACIONES</text>
    <rect x="800" y="168" width="120" height="3" fill="#FF6B2C"/>
    <rect x="1000" y="168" width="120" height="3" fill="#FF6B2C"/>
    <rect x="800" y="294" width="120" height="3" fill="#2A313A"/>
    <rect x="1000" y="294" width="120" height="3" fill="#2A313A"/>
  </g>

  <!-- Integraciones -->
  <rect x="40" y="340" width="1120" height="64" rx="8" fill="#11151A" stroke="#2A313A"/>
  <g class="mono" font-size="13">
    <text x="64" y="378" fill="#FF6B2C" letter-spacing="2">INTEGRA</text>
    <text x="160" y="378" fill="#C9D1D9">Slack OAuth · /agendar · Home tab   ·   Zoom S2S   ·   Redmine webhook + API   ·   IMAP / iCal   ·   API REST v1</text>
  </g>
</svg>
